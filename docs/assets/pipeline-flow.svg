<text x="628" y="254" font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#EAF6FF">check_availability</text>
<rect x="354" y="271" width="248" height="28" rx="7" fill="#0E2A4F" stroke="#2A5A8F"/>
<text x="366" y="290" font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#EAF6FF">book_appointment</text>
