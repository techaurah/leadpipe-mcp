<text x="610.0" y="335" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#00CEFF" text-anchor="middle">Guardrails: dedup on capture · no stage backwards · no double-booking</text>
<line x1="890" y1="215" x2="942" y2="215" stroke="#00CEFF" stroke-width="2.5"/>
<polygon points="942,209 954,215 942,221" fill="#00CEFF"/>
<text x="921.0" y="203" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#00CEFF" text-anchor="middle">writes</text>
<rect x="952" y="112" width="280" height="100" rx="12" fill="#12294D" stroke="#00CEFF" stroke-width="2"/>
<text x="974" y="150" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#00CEFF">GOOGLE SHEETS</text>
<text x="974" y="180" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#9DB8D2">The pipeline lives in a sheet</text>
<text x="974" y="204" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#9DB8D2">the business already owns.</text>
<rect x="952" y="226" width="280" height="100" rx="12" fill="#12294D" stroke="#00CEFF" stroke-width="2"/>
<text x="974" y="264" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#00CEFF">GOOGLE CALENDAR</text>
<text x="974" y="294" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#9DB8D2">Availability checks and</text>
<text x="974" y="318" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#9DB8D2">bookings, with no overlap.</text>
<text x="48" y="402" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9DB8D2">Demo mode runs the same pipeline on an in-memory store, zero credentials, so anyone can try it in five minutes.</text>
