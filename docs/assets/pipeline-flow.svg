<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-label="How LeadPipe MCP works: an AI assistant calls eight guardrailed tools that run a lead pipeline on Google Sheets and Calendar">
<rect width="1280" height="430" rx="18" fill="#0B1F3A"/>
<text x="48" y="52" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#EAF6FF">How LeadPipe works</text>
<text x="48" y="80" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9DB8D2">One MCP server between your AI assistant and the tools your business already owns.</text>
<rect x="48" y="120" width="215" height="190" rx="12" fill="#12294D" stroke="#2A5A8F" stroke-width="1.5"/>
<text x="70" y="158" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#EAF6FF">AI ASSISTANT</text>
<text x="70" y="188" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#9DB8D2">Claude, Cursor or any</text>
<text x="70" y="212" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#9DB8D2">MCP client. It asks in</text>
<text x="70" y="236" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#9DB8D2">plain language:</text>
<text x="70" y="260" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#9DB8D2">&quot;Score this lead and</text>
<text x="70" y="284" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#9DB8D2">book the hot ones.&quot;</text>
